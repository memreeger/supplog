services:
  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - supplog_postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:postgresql://postgres:5432/supplog_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      JWT_SECRET: ${JWT_SECRET}

      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_TIME_ZONE: UTC

      ADMIN_SEED_ENABLED: "false"

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  supplog_postgres_data: