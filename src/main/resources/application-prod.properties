server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Required production secrets/connections (no local fallback)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.seed.admin.enabled=${ADMIN_SEED_ENABLED:false}

# Production web/security
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Production database pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# Schema changes are managed only by Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Production health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never