spring.application.name=supplog

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supplog_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false

# Application-wide date boundary used by admin dashboard statistics
app.time-zone=${APP_TIME_ZONE:UTC}

# Routine execution lifecycle synchronization
app.routine-execution.lifecycle-interval-ms=${ROUTINE_EXECUTION_LIFECYCLE_INTERVAL_MS:900000}
app.routine-execution.lifecycle-initial-delay-ms=${ROUTINE_EXECUTION_LIFECYCLE_INITIAL_DELAY_MS:10000}
app.routine-execution.missed-interval-ms=${ROUTINE_EXECUTION_MISSED_INTERVAL_MS:60000}
app.routine-execution.missed-initial-delay-ms=${ROUTINE_EXECUTION_MISSED_INITIAL_DELAY_MS:60000}
spring.data.web.pageable.max-page-size=100
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.rate-limit.auth.max-requests=${AUTH_RATE_LIMIT_MAX_REQUESTS:20}
app.rate-limit.auth.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.support.max-requests=${SUPPORT_RATE_LIMIT_MAX_REQUESTS:120}
app.rate-limit.support.window-seconds=${SUPPORT_RATE_LIMIT_WINDOW_SECONDS:60}
# X-Forwarded-For listesinde sağdan kaçıncı girdi istemci IP sayılır (0 = remoteAddr).
app.rate-limit.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:0}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}
app.jwt.refresh-absolute-expiration-days=${REFRESH_TOKEN_ABSOLUTE_EXPIRATION_DAYS:90}
app.jwt.refresh-reuse-grace-seconds=${REFRESH_TOKEN_REUSE_GRACE_SECONDS:10}
app.jwt.refresh-cleanup-cron=${REFRESH_TOKEN_CLEANUP_CRON:0 30 3 * * *}
app.auth.client-type-header=X-Client-Type
app.auth.refresh-cookie.name=${REFRESH_COOKIE_NAME:supplog_refresh}
app.auth.refresh-cookie.path=/api/v1/auth
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Strict}
# Şifre sıfırlama
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
app.password-reset.max-requests-per-hour=${PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:3}
app.password-reset.cleanup-cron=${PASSWORD_RESET_CLEANUP_CRON:0 45 3 * * *}
# Mail: log (gönderilmez, loglanır) | brevo
app.mail.provider=${MAIL_PROVIDER:log}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
app.mail.from-address=${MAIL_FROM_ADDRESS:}
app.mail.from-name=${MAIL_FROM_NAME:Supplog}
# Maildeki linkler için
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Optional admin seed
app.seed.admin.enabled=${ADMIN_SEED_ENABLED:false}
app.seed.admin.username=${ADMIN_SEED_USERNAME:}
app.seed.admin.email=${ADMIN_SEED_EMAIL:}
app.seed.admin.password=${ADMIN_SEED_PASSWORD:}
app.seed.admin.time-zone=${ADMIN_SEED_TIME_ZONE:UTC}

app.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
app.notifications.retention-days=${NOTIFICATIONS_RETENTION_DAYS:90}
app.notifications.cleanup-cron=${NOTIFICATIONS_CLEANUP_CRON:0 15 4 * * *}
app.notifications.reminder-interval-ms=${NOTIFICATIONS_REMINDER_INTERVAL_MS:60000}
spring.task.scheduling.pool.size=4

app.notifications.device-token-stale-days=${NOTIFICATIONS_DEVICE_TOKEN_STALE_DAYS:60}
