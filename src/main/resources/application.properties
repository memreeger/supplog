spring.application.name=supplog

# PostgreSQL Bağlantı Bilgileri
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supplog_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


# JPA / Hibernate Ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Optional admin seed
app.seed.admin.enabled=${ADMIN_SEED_ENABLED:false}
app.seed.admin.username=${ADMIN_SEED_USERNAME:}
app.seed.admin.email=${ADMIN_SEED_EMAIL:}
app.seed.admin.password=${ADMIN_SEED_PASSWORD:}