spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/supplog_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

app.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes
app.jwt.expiration-ms=3600000
app.seed.admin.enabled=false
app.routine-execution.lifecycle-interval-ms=3600000
app.routine-execution.lifecycle-initial-delay-ms=3600000
